<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoSTL Video Intelligence</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-brand">
          <h1>GeoSTL Video Intelligence</h1>
          <p>Sidewalk infrastructure inventory</p>
        </div>
        <div id="status-pill" class="status-pill">Loading</div>
      </header>

      <main class="layout">
        <section class="map-panel">
          <div id="map"></div>
        </section>

        <aside class="sidebar">
          <!-- Filters always visible -->
          <section class="panel filters-panel">
            <h2>Filters</h2>
            <div id="filters-list" class="filters-list"></div>
          </section>

          <!-- Tabbed panel -->
          <section class="panel tabs-panel">
            <div class="tab-bar">
              <button class="tab-btn active" data-tab="detail">Detail</button>
              <button class="tab-btn" data-tab="metrics">Metrics</button>
              <button class="tab-btn" data-tab="comparison">Comparison</button>
            </div>

            <!-- Detail Tab -->
            <div class="tab-content" id="tab-detail">
              <div id="detail-empty" class="empty-state">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
                <span>Select a detection on the map</span>
              </div>
              <div id="detail-card" class="detail-card hidden">
                <div class="detail-header">
                  <span id="detail-name" class="detail-title"></span>
                  <span id="detail-type-badge" class="type-badge"></span>
                </div>
                <div class="detail-grid">
                  <div class="detail-row">
                    <span class="detail-label">Condition</span>
                    <span id="detail-condition" class="detail-value"></span>
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Confidence</span>
                    <span id="detail-confidence" class="detail-value"></span>
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Sidewalk</span>
                    <span id="detail-presence" class="detail-value"></span>
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Width (m)</span>
                    <span id="detail-width" class="detail-value"></span>
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Curb Ramp</span>
                    <span id="detail-curb-ramp" class="detail-value"></span>
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Obstructions</span>
                    <span id="detail-obstructions" class="detail-value"></span>
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Hazards</span>
                    <span id="detail-hazards" class="detail-value"></span>
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Crossings</span>
                    <span id="detail-crossings" class="detail-value"></span>
                  </div>
                  <div class="detail-row">
                    <span class="detail-label">Transport</span>
                    <span id="detail-transport" class="detail-value"></span>
                  </div>
                </div>
                <div class="detail-description-block">
                  <span class="detail-label">Description</span>
                  <p id="detail-description" class="detail-description"></p>
                </div>
                <div class="detail-clip-block">
                  <span class="detail-label">Clip</span>
                  <span id="detail-clip" class="detail-value muted"></span>
                  <video id="detail-video" controls style="display:none;width:100%;border-radius:6px;margin-top:6px;"></video>
                </div>
                <div class="followup-block">
                  <div class="followup-block-header">
                    <span class="detail-label">Field Follow-up</span>
                    <span id="followup-badge" class="followup-badge hidden">AI Analyzed</span>
                  </div>
                  <div id="followup-existing" class="hidden"></div>
                  <div id="followup-upload-area">
                    <input type="file" id="followup-file-input" accept="video/*" style="display:none" />
                    <button id="followup-upload-btn" class="followup-btn">Upload follow-up video</button>
                  </div>
                  <div id="followup-status" class="followup-status hidden"></div>
                  <video id="followup-video" controls style="display:none;width:100%;border-radius:6px;margin-top:6px;"></video>
                  <div id="followup-results" class="hidden"></div>
                </div>
              </div>
            </div>

            <!-- Metrics Tab -->
            <div class="tab-content hidden" id="tab-metrics">
              <div id="metrics-summary" class="stat-grid"></div>
              <div id="counts-chart" class="chart"></div>
              <div id="quality-chart" class="chart"></div>
            </div>

            <!-- Comparison Tab -->
            <div class="tab-content hidden" id="tab-comparison">
              <div id="comparison-summary" class="stat-grid"></div>
              <div id="comparison-chart" class="chart"></div>
              <div id="comparison-table" class="comparison-table"></div>
            </div>
          </section>
        </aside>
      </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
